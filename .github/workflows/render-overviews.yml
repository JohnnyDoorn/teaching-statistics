name: Render course overviews

# Re-renders the SSR and RMS overview pages whenever their inputs change, and
# commits the resulting HTML back to main. GitHub Pages serves this repo in
# "legacy" mode (branch main, path /), so it publishes whatever HTML is
# committed here; it never runs Quarto itself.
on:
  push:
    branches: [main]
    paths:
      # SSR: the overview itself, the listing chunk, and the lecture qmds it reads
      - 'ssr/overview-ssr.qmd'
      - 'ssr/2026/SSR.qmd'
      - 'ssr/2026/**/*.qmd'
      - 'ssr/overview-styles.scss'
      - 'ssr/_quarto.yml'
      # RMS: the overview itself and the slide/OEQ folder it monitors
      - 'rms/overview-rms.qmd'
      - 'rms/slides/2026/**'
      - 'rms/overview-styles.scss'
      - 'rms/_quarto.yml'
      # shared inputs
      - '_quarto.yml'
      - 'extra-texts/*.qmd'
      - 'datasets/2025/**'
      - '.github/workflows/render-overviews.yml'
  workflow_dispatch:

# Never let two renders race for the same commit.
concurrency:
  group: render-overviews
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    # Don't re-trigger on this workflow's own commit.
    if: github.actor != 'github-actions[bot]'

    steps:
      # The repo is ~4 GB. A blobless, sparse checkout pulls only the paths the
      # two overview pages actually read (a few tens of MB) instead of the lot.
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /_quarto.yml
            /style.scss
            /footer.html
            /footer.qmd
            /ssr/_quarto.yml
            /ssr/overview-ssr.qmd
            /ssr/overview-styles.scss
            /ssr/overview-ssr.html
            /ssr/overview-ssr_files/**
            /ssr/2026/**/*.qmd
            /rms/_quarto.yml
            /rms/overview-rms.qmd
            /rms/overview-styles.scss
            /rms/overview-rms.html
            /rms/overview-rms_files/**
            /rms/slides/2026/**
            /extra-texts/*.qmd
            /datasets/2025/**

      # Pinned to the version Johnny renders with locally, so CI and local
      # renders produce byte-identical HTML instead of fighting over the diff.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.3.340

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::stringr
            any::dplyr
            any::lubridate
            any::kableExtra

      - name: Render SSR overview
        run: quarto render ssr/overview-ssr.qmd --to html

      - name: Render RMS overview
        run: quarto render rms/overview-rms.qmd --to html

      - name: Commit rendered pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the generated pages. Never `git add -A`: the sparse
          # checkout makes every unlisted path look deleted, and a blanket add
          # would commit those deletions.
          git add -- \
            ssr/overview-ssr.html \
            ssr/overview-ssr_files \
            rms/overview-rms.html \
            rms/overview-rms_files

          if git diff --cached --quiet; then
            echo "Overview pages unchanged - nothing to commit."
            exit 0
          fi

          git commit -m "chore: re-render SSR and RMS overview pages [skip ci]"
          git push
